[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0.3"
]
[project]
name = "Fhir_extractor"
version = "0.1.0"
authors = [
    { email = "wilsoncarlosraul@gmail.com", name = "Carlos Wilson"},
]

license = "MIT"
description = "Patient Data FHIR Test Server extraction and visualization"

dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "psycopg2-binary>=2.9.12",
    "pandas>=3.0.4",
    "dotenv>=0.9.9",
    "playwright>=1.61.0",
    "SQLAlchemy>=2.0.51"

]